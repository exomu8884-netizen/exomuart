<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>둘리키우기</title>
<meta name="description" content="강아지를 한 마리 데려와 집에서 키웁니다. 밥 주고 산책시키고 아프면 병원에 데려갑니다.">
<meta name="theme-color" content="#e07ba6">

<!-- 홈 화면에 추가하면 「둘리키우기」 아이콘이 생긴다 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- 홈 화면 바로가기에 찍히는 이름 -->
<meta name="apple-mobile-web-app-title" content="둘리 이야기">
<meta name="application-name" content="둘리 이야기">
<meta name="mobile-web-app-capable" content="yes">

<!-- 링크로 보낼 때 뜨는 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="둘리 이야기">
<meta property="og:title" content="둘리 이야기">
<meta property="og:description" content="강아지를 한 마리 데려와 집에서 키웁니다. 눌러서 시작하세요.">
<meta property="og:url" content="https://exomu.art/">
<meta property="og:image" content="https://exomu.art/icons/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="둘리 이야기">
<meta name="twitter:image" content="https://exomu.art/icons/icon-512.png">

<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="frame">
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- 위쪽 띠 -->
      <div id="top">
        <div id="topleft">
          <div id="money">0원</div>
          <div id="clock">아침 8시 · 1일째</div>
        </div>
        <div id="topbtns">
          <button class="tb" data-go="shop">분양가게</button>
          <button class="tb" data-go="store">용품</button>
          <button class="tb" data-go="book">도감</button>
          <button class="tb" data-go="settings">설정</button>
        </div>
      </div>

      <!-- 경고 띠 -->
      <div id="warn" hidden></div>

      <!-- 아래쪽 판 -->
      <div id="bottom">
        <button id="fold" title="접기">▼  접기</button>
        <div id="chips"></div>
        <div id="petname">아직 아무도 없습니다</div>
        <div id="petnote">분양가게에서 데려오세요.</div>
        <div id="bars"></div>
        <div id="actions">
          <button class="ab primary" data-act="feed">밥</button>
          <button class="ab" data-act="play">놀기</button>
          <button class="ab" data-act="walk">산책</button>
          <button class="ab" data-act="wash">씻기</button>
          <button class="ab" data-act="pat">쓰다듬기</button>
          <button class="ab" data-act="sleep">재우기</button>
          <button class="ab" data-act="clinic">병원</button>
          <button class="ab muted" data-act="send">보내기</button>
        </div>
      </div>

      <div id="toasts"></div>
      <div id="overlay" hidden></div>

      <div id="loading">
        <div class="t">둘리키우기</div>
        <div class="h">방을 짓는 중입니다…</div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
