<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쉬운 경제학 — exomu's home</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3169773352082499" crossorigin="anonymous"></script>
<style>
:root{--bg:#f7f7f5;--card:#ffffff;--ink:#1c1c1c;--sub:#8a8a8a;--line:#ececec;--sidebar-w:240px;}
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.75}
a{color:inherit;text-decoration:none}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:#141319;color:#eee;padding:28px 20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .logo{display:block;font-weight:800;font-size:1.35rem;letter-spacing:-.5px;color:#fff;margin-bottom:6px}
.sidebar .logo span{color:#c9a6ff}
.sidebar .tagline{color:#8a8a95;font-size:.8rem;margin-bottom:28px}
.sidebar nav a{display:block;padding:11px 14px;margin-bottom:4px;border-radius:8px;color:#cfcfd6;font-size:.95rem;font-weight:600}
.sidebar nav a:hover{background:#232230;color:#fff}
.sidebar nav a.active{background:#2c2a3d;color:#fff}
main.content{flex:1;min-width:0;padding:36px 44px 80px;max-width:900px}
.hero{padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero h1{font-size:1.6rem;margin:0 0 6px}
.hero p{color:var(--sub);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.pcard{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:transform .15s}
.pcard:hover{transform:translateY(-3px)}
.pcard img{width:100%;display:block;aspect-ratio:1200/630;object-fit:cover}
.pcard .pc-body{padding:16px 18px}
.pc-cat{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.pcard h3{font-size:1.02rem;margin:0 0 6px;line-height:1.4}
.pcard .pc-date{color:var(--sub);font-size:.8rem}
.empty-note{color:var(--sub);font-size:.92rem;padding:30px 0}
article.post{background:var(--card);border-radius:16px;padding:40px 44px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
article.post .pc-cat{margin-bottom:14px}
article.post h1{font-size:1.85rem;margin:.1em 0 .2em;line-height:1.35}
article.post .meta{color:var(--sub);font-size:.9rem;margin-bottom:22px}
article.post img{max-width:100%;border-radius:10px;margin:20px 0;display:block}
article.post h3{font-size:1.2rem;margin-top:1.8em;margin-bottom:.5em}
article.post p{margin:0 0 1.1em}
.note{background:#fafaf5;border-left:4px solid #d8c98a;padding:14px 16px;font-size:.9rem;color:#6b6144;border-radius:6px;margin:1.2em 0}
.tags{margin-top:2em;padding-top:1.4em;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.tag{background:#f0f0ee;color:#666;font-size:.8rem;padding:5px 12px;border-radius:20px}
footer.sitefoot{text-align:center;color:#aaa;font-size:.82rem;padding:30px 0}
footer.sitefoot a{color:#999;text-decoration:underline}
.backlink{display:inline-block;margin-top:30px;color:#888;font-size:.9rem}
.stats-box{margin-top:22px;padding:16px 14px;background:#1c1b26;border-radius:10px;font-size:.82rem}
.stats-row{display:flex;justify-content:space-between;padding:5px 0;color:#cfcfd6}
.stats-row b{color:#fff;font-weight:700}
.stats-pop{margin-top:10px;padding-top:10px;border-top:1px solid #2c2b3a}
.stats-pop-title{color:#8a8a95;font-size:.72rem;margin-bottom:6px}
.stats-pop ol{margin:0;padding-left:18px;color:#cfcfd6}
.stats-pop li{margin-bottom:5px;line-height:1.4;font-size:.82rem}
.stats-pop a{color:#cfcfd6}
.stats-pop a:hover{color:#fff}
.post-views{margin-top:1.6em;padding-top:1em;border-top:1px solid var(--line);color:var(--sub);font-size:.88rem}
@media (max-width:760px){.layout{flex-direction:column}.sidebar{position:static;height:auto;width:100%}main.content{padding:24px 18px 60px}}
</style></head><body>
<div class="layout">
<aside class="sidebar">
<a class="logo" href="index.html">exomu<span>'s home</span></a>
<div class="tagline">매일 새로 쌓는 개인 아카이브</div>
<nav id="nav">
<a href="category-movie.html">영화와 사상</a>
<a href="category-art.html">미술과 사상</a>
<a href="category-books.html">도서와 사상</a>
<a href="category-psych.html">심리학용어사전</a>
<a href="category-econ.html" class="active">쉬운 경제학</a>
<a href="category-knowhow.html">노하우</a>
</nav>
<div class="stats-box">
<div class="stats-row"><span>누적 방문자</span><b id="stat-total">–</b></div>
<div class="stats-row"><span>오늘 방문자</span><b id="stat-today">–</b></div>
<div class="stats-pop">
<div class="stats-pop-title">인기 게시물</div>
<ol id="stat-popular"><li>불러오는 중…</li></ol>
</div>
</div>
</aside>
<main class="content">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-3169773352082499" data-ad-slot="6448432776" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
<div class="hero"><h1>쉬운 경제학</h1><p>복잡한 경제를 유동성의 흐름으로 쉽게 읽습니다.</p></div>
<div id="content"><div class="empty-note">불러오는 중…</div></div>
</main></div><footer class="sitefoot"><a href="mailto:exomu@naver.com">exomu@naver.com</a></footer>
<script>window.PAGE={"type": "category", "cat": "econ"};</script>
<script>
(function(){
var NS="exomuart", API="https://abacus.jasoncameron.dev";
var CATS=[["movie","영화와 사상","#4a3b78"],["art","미술과 사상","#8a4a3a"],["books","도서와 사상","#2f5d4f"],["psych","심리학용어사전","#8040a8"],["econ","쉬운 경제학","#2b4a86"],["knowhow","노하우","#136b7a"]];
var NAME={},COLOR={},KEYBYNAME={};
CATS.forEach(function(c){NAME[c[0]]=c[1];COLOR[c[0]]=c[2];KEYBYNAME[c[1]]=c[0];});
var PAGE=window.PAGE||{type:"index"};
var MISS=6, MAXID=600, BATCH=8;
function pad(n){return (n<10?"0":"")+n;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function hit(k){return fetch(API+"/hit/"+NS+"/"+k).then(function(r){return r.json()}).then(function(j){return j.value||0}).catch(function(){return 0})}
function get(k){return fetch(API+"/get/"+NS+"/"+k).then(function(r){return r.ok?r.json():{value:0}}).then(function(j){return j.value||0}).catch(function(){return 0})}
function todayKey(){var d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"}));var y=d.getFullYear(),m=("0"+(d.getMonth()+1)).slice(-2),day=("0"+d.getDate()).slice(-2);return "day-"+y+m+day;}
function parsePost(id,html){
 try{
  var doc=new DOMParser().parseFromString(html,"text/html");
  var mEl=doc.getElementById("post-meta");
  if(mEl){var m=JSON.parse(mEl.textContent);m.id=m.id||id;if(!COLOR[m.cat])m.cat="knowhow";return m;}
  var art=doc.querySelector("article.post");
  var h1=(art&&art.querySelector("h1"))||doc.querySelector("h1");
  var title=h1?h1.textContent.trim():((doc.title||"").replace(/\s*—\s*exomu.*$/,"").trim());
  var catEl=art&&art.querySelector(".pc-cat");
  var cat=catEl?(KEYBYNAME[catEl.textContent.trim()]||"knowhow"):"knowhow";
  var metaEl=art&&art.querySelector(".meta");
  var date=metaEl?metaEl.textContent.split("·")[0].trim():"";
  var imgEl=art&&art.querySelector("img");
  var img=imgEl?imgEl.getAttribute("src"):(id+"_img1.png");
  if(!title)return null;
  return {id:id,cat:cat,title:title,date:date,img:img};
 }catch(e){return null;}
}
function loadCache(){try{return JSON.parse(localStorage.getItem("exomu_posts")||"{}").posts||{}}catch(e){return {}}}
function saveCache(p){try{localStorage.setItem("exomu_posts",JSON.stringify({posts:p,t:Date.now()}))}catch(e){}}
function vals(o){return Object.keys(o).map(function(k){return o[k]})}
function discover(){
 var results=loadCache();
 return new Promise(function(resolve){
  var n=1,last=0,done=false;
  Object.keys(results).forEach(function(k){var v=parseInt(k,10);if(v>last)last=v;});
  function batch(){
   if(done||n>MAXID){saveCache(results);resolve(vals(results));return;}
   var ids=[];for(var i=0;i<BATCH;i++)ids.push(n+i);n+=BATCH;
   Promise.all(ids.map(function(k){
    var id=pad(k);
    if(results[id])return Promise.resolve([k,results[id]]);
    return fetch("post-"+id+".html",{cache:"force-cache"}).then(function(r){return r.ok?r.text():null}).then(function(h){return [k,h?parsePost(id,h):null]}).catch(function(){return [k,null]});
   })).then(function(arr){
    arr.forEach(function(p){if(p[1]){results[pad(p[0])]=p[1];if(p[0]>last)last=p[0];}});
    if(n-1>last+MISS)done=true;
    batch();
   });
  }
  batch();
 });
}
function pcard(p){
 return '<a class="pcard" href="post-'+p.id+'.html"><img src="'+esc(p.img)+'" alt="'+esc(p.title)+'"><div class="pc-body"><span class="pc-cat" style="background:'+(COLOR[p.cat]||"#888")+'">'+esc(NAME[p.cat]||"")+'</span><h3>'+esc(p.title)+'</h3><div class="pc-date">'+esc(p.date)+'</div></div></a>';
}
function bycat(list,cat){return list.filter(function(p){return p.cat===cat}).sort(function(a,b){return parseInt(b.id,10)-parseInt(a.id,10)});}
function renderNav(list){
 var counts={};CATS.forEach(function(c){counts[c[0]]=0});
 list.forEach(function(p){if(counts[p.cat]!=null)counts[p.cat]++});
 var nav=document.getElementById("nav");if(!nav)return;
 nav.innerHTML=CATS.map(function(c){var act=(PAGE.type==="category"&&PAGE.cat===c[0])?' class="active"':'';return '<a href="category-'+c[0]+'.html"'+act+'>'+c[1]+' ('+(counts[c[0]]||0)+')</a>';}).join("");
}
function renderContent(list){
 var el=document.getElementById("content");if(!el)return;
 var cats=PAGE.type==="category"?[PAGE.cat]:CATS.map(function(c){return c[0]});
 var html="";
 cats.forEach(function(cat){
  var ps=bycat(list,cat).slice(0,7);
  if(PAGE.type!=="category")html+='<h2 style="font-size:1.25rem;margin:1.6em 0 .8em">'+esc(NAME[cat])+'</h2>';
  html+=ps.length?'<div class="grid">'+ps.map(pcard).join("")+'</div>':'<div class="empty-note">아직 게시물이 없습니다.</div>';
 });
 el.innerHTML=html;
}
function renderPopular(list){
 var el=document.getElementById("stat-popular");if(!el||!list.length)return;
 Promise.all(list.map(function(p){return get("post-"+p.id).then(function(v){return {id:p.id,title:p.title,v:v}})})).then(function(a){
  a.sort(function(x,y){return y.v-x.v});
  el.innerHTML=a.slice(0,5).map(function(p){return '<li><a href="post-'+p.id+'.html">'+esc(p.title)+'</a></li>'}).join("");
 }).catch(function(){el.innerHTML='<li>통계를 불러올 수 없습니다</li>'});
}
function renderAll(list){renderNav(list);renderContent(list);renderPopular(list);}
var tk=todayKey(),flag="exomu_v_"+tk;
if(!localStorage.getItem(flag)){hit("total-visits");hit(tk);localStorage.setItem(flag,"1");}
var te=document.getElementById("stat-total"),de=document.getElementById("stat-today");
if(te)get("total-visits").then(function(v){te.textContent=v.toLocaleString()});
if(de)get(tk).then(function(v){de.textContent=v.toLocaleString()});
if(PAGE.type==="post"&&PAGE.id){var ve=document.getElementById("post-view-count");if(ve)hit("post-"+PAGE.id).then(function(v){ve.textContent=v.toLocaleString()});}
var cached=vals(loadCache());
if(cached.length)renderAll(cached);
discover().then(renderAll);
})();
</script>
</body></html>
