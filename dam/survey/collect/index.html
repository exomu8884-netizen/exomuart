<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문 수거 — 댐 아래 장이 선다</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f5d50">
<style>
:root{ --bg:#f7f4ee; --card:#fff; --ink:#1d201f; --dim:#5d6260; --line:#e2ddd3; --accent:#2f5d50; --accent-soft:#e8f0ec; }
@media (prefers-color-scheme:dark){
  :root{ --bg:#15181a; --card:#1e2325; --ink:#eceae4; --dim:#a3aaa7; --line:#323a3c; --accent:#7fb9a4; --accent-soft:#1f2b27; }
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.7; word-break:keep-all}
.wrap{max-width:1000px; margin:0 auto; padding:24px 16px 60px}
h1{font-size:22px; margin:0}
p.lead{color:var(--dim); font-size:14.5px}
h2{font-size:18px; margin:28px 0 0; display:flex; align-items:center; gap:8px}
h2::before{content:""; width:4px; height:17px; background:var(--accent); border-radius:2px}
textarea{width:100%; min-height:200px; font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:13.5px; padding:12px; border:1px solid var(--line); border-radius:12px;
  background:var(--card); color:var(--ink); resize:vertical; margin-top:10px}
.btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{font:inherit; font-size:15px; font-weight:700; cursor:pointer; border-radius:10px; padding:11px 16px;
  border:1px solid var(--accent); background:var(--card); color:var(--accent)}
button.primary{background:var(--accent); color:#fff}
.count{margin-top:12px; font-size:15px; font-weight:700; color:var(--accent)}
.scroll{overflow-x:auto; margin-top:12px; border:1px solid var(--line); border-radius:12px; background:var(--card)}
table{border-collapse:collapse; width:100%; font-size:13.5px; white-space:nowrap}
th,td{border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top}
th{background:var(--accent-soft); font-size:12.5px; position:sticky; top:0}
td.wide{white-space:normal; min-width:220px}
.sum{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin-top:12px}
.box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px}
.box h3{margin:0 0 6px; font-size:14px; color:var(--accent)}
.box div{font-size:14.5px}
.box .big{font-size:26px; font-weight:700}
.bad{margin-top:10px; font-size:14px; color:#b4531f; font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <h1>설문 수거 · 「댐 아래 장이 선다」</h1>
  <p class="lead">참가자가 카카오톡·문자로 보낸 답을 여기에 몽땅 붙여 넣으십시오. 여러 사람 것을 한꺼번에 붙여 넣어도 됩니다. 「댐아래장이선다 설문」로 시작하는 덩어리만 골라 읽습니다. 이 페이지는 아무 데도 보내지 않습니다 — 계산은 이 브라우저 안에서만 하고, 붙여 넣은 것은 이 기기에만 남습니다.</p>

  <textarea id="raw" placeholder="여기에 붙여 넣으십시오."></textarea>
  <div class="btns">
    <button class="primary" type="button" id="runBtn">읽기</button>
    <button type="button" id="csvBtn">CSV로 내려받기</button>
    <button type="button" id="clearBtn">지우기</button>
  </div>
  <p class="count" id="count"></p>
  <p class="bad" id="bad"></p>

  <div id="out"></div>

</div>

<script>
(function(){
  "use strict";

  var PLACES = ["호로고루","전곡5일장","재인폭포","한탄강댐","댑싸리밭"];
  var COLS = ["응답","만족"].concat(PLACES.map(function(p){ return "시간·" + p; }))
    .concat(["좋았던자리","댐이하는일","내돈이면","하루길이","다시온다면","유료라면","고칠것","연령","사는곳"]);

  var KEY = "dam-survey-raw";
  var raw = document.getElementById("raw");
  try { raw.value = localStorage.getItem(KEY) || ""; } catch(e){}

  var rows = [];

  function parse(text){
    var lines = text.split(/\r?\n/), out = [], cur = null, i, line, eq, k, v;
    for (i = 0; i < lines.length; i++){
      line = lines[i].trim();
      if (!line) continue;
      if (line.indexOf("댐아래장이선다 설문") === 0){
        if (cur) out.push(cur);
        cur = { "응답": line.replace("댐아래장이선다 설문", "").trim() || "-" };
        continue;
      }
      if (!cur) continue;
      eq = line.indexOf("=");
      if (eq < 1) continue;
      k = line.slice(0, eq).trim();
      v = line.slice(eq + 1).trim();
      if (k === "시간"){
        v.split("|").forEach(function(pair){
          var p = pair.split(":");
          if (p.length === 2) cur["시간·" + p[0].trim()] = p[1].trim();
        });
      } else {
        cur[k] = v;
      }
    }
    if (cur) out.push(cur);
    return out;
  }

  function esc(s){
    return String(s === undefined ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function tally(field, split){
    var m = {}, i, vs;
    for (i = 0; i < rows.length; i++){
      var raw1 = rows[i][field];
      if (!raw1) continue;
      vs = split ? raw1.split("|") : [raw1];
      vs.forEach(function(v){ v = v.trim(); if (v) m[v] = (m[v] || 0) + 1; });
    }
    return Object.keys(m).sort(function(a,b){ return m[b] - m[a]; })
      .map(function(k){ return k + " <b>" + m[k] + "</b>"; }).join("<br>") || "—";
  }

  function render(){
    var out = document.getElementById("out"), h = "";

    // 요약
    var sum = 0, n = 0, i;
    for (i = 0; i < rows.length; i++){
      var s = parseFloat(rows[i]["만족"]);
      if (!isNaN(s)){ sum += s; n++; }
    }
    h += "<h2>한눈에</h2><div class='sum'>";
    h += "<div class='box'><h3>만족도 평균</h3><div class='big'>" +
         (n ? (sum / n).toFixed(1) : "—") + "</div><div>" + n + "명 답함 · 10점 만점</div></div>";
    h += "<div class='box'><h3>다시 온다면 어느 철</h3><div>" + tally("다시온다면", true) + "</div></div>";
    h += "<div class='box'><h3>유료라면 얼마까지</h3><div>" + tally("유료라면", false) + "</div></div>";
    h += "<div class='box'><h3>가장 좋았던 자리</h3><div>" + tally("좋았던자리", false) + "</div></div>";
    h += "<div class='box'><h3>내 돈이면 장에서</h3><div>" + tally("내돈이면", false) + "</div></div>";
    h += "<div class='box'><h3>하루 길이</h3><div>" + tally("하루길이", false) + "</div></div>";
    h += "</div>";

    // 댐이 하는 일 — 결과보고에 그대로 인용할 대목
    h += "<h2>한탄강댐이 하는 일 — 참가자가 쓴 그대로</h2><div class='scroll'><table><tbody>";
    for (i = 0; i < rows.length; i++){
      if (rows[i]["댐이하는일"])
        h += "<tr><td>" + esc(rows[i]["응답"]) + "</td><td class='wide'>" + esc(rows[i]["댐이하는일"]) + "</td></tr>";
    }
    h += "</tbody></table></div>";

    // 고칠 것
    h += "<h2>고칠 것</h2><div class='scroll'><table><tbody>";
    for (i = 0; i < rows.length; i++){
      if (rows[i]["고칠것"])
        h += "<tr><td>" + esc(rows[i]["응답"]) + "</td><td class='wide'>" + esc(rows[i]["고칠것"]) + "</td></tr>";
    }
    h += "</tbody></table></div>";

    // 전체 표
    h += "<h2>전체</h2><div class='scroll'><table><thead><tr>";
    COLS.forEach(function(c){ h += "<th>" + esc(c) + "</th>"; });
    h += "</tr></thead><tbody>";
    for (i = 0; i < rows.length; i++){
      h += "<tr>";
      COLS.forEach(function(c){
        var wide = (c === "댐이하는일" || c === "고칠것");
        h += "<td" + (wide ? " class='wide'" : "") + ">" + esc(rows[i][c] || "") + "</td>";
      });
      h += "</tr>";
    }
    h += "</tbody></table></div>";

    out.innerHTML = h;
  }

  function run(){
    try { localStorage.setItem(KEY, raw.value); } catch(e){}
    rows = parse(raw.value);
    document.getElementById("count").textContent = rows.length + "명 읽었습니다.";
    var bad = document.getElementById("bad");
    bad.textContent = (raw.value.trim() && !rows.length)
      ? "「댐아래장이선다 설문」로 시작하는 덩어리를 못 찾았습니다. 받은 글을 통째로 붙여 넣으셨는지 보십시오."
      : "";
    render();
  }

  function csv(){
    if (!rows.length){ run(); if (!rows.length) return; }
    var q = function(s){ return '"' + String(s === undefined ? "" : s).replace(/"/g,'""') + '"'; };
    var lines = [COLS.map(q).join(",")];
    rows.forEach(function(r){ lines.push(COLS.map(function(c){ return q(r[c] || ""); }).join(",")); });
    var blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "댐아래장이선다_설문.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  document.getElementById("runBtn").addEventListener("click", run);
  document.getElementById("csvBtn").addEventListener("click", csv);
  document.getElementById("clearBtn").addEventListener("click", function(){
    if (!confirm("붙여 넣은 것을 지웁니다. 받은 카톡이 남아 있으면 다시 붙여 넣으실 수 있습니다.")) return;
    raw.value = "";
    try { localStorage.removeItem(KEY); } catch(e){}
    rows = [];
    document.getElementById("count").textContent = "";
    document.getElementById("bad").textContent = "";
    document.getElementById("out").innerHTML = "";
  });

  if (raw.value.trim()) run();
})();
</script>
</body>
</html>
