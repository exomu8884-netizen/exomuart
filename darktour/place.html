<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- meta -->
<meta name="description" content="이 자리에서 지워진 사람은 누구인가. 이야기와 관점별 해설, 방문 예절, 그리고 출처를 함께 봅니다.">
<meta name="theme-color" content="#101014">
<link rel="canonical" href="https://exomu.art/darktour/place.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta property="og:site_name" content="다크투어 · exomu.art">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="장소 — 다크투어">
<meta property="og:description" content="이 자리에서 지워진 사람은 누구인가. 이야기와 관점별 해설, 방문 예절, 그리고 출처를 함께 봅니다.">
<meta property="og:url" content="https://exomu.art/darktour/place.html">
<meta property="og:image" content="https://exomu.art/darktour/og.png">

<meta property="og:image:alt" content="다크투어 — 누가 여기서 지워졌는가. 민중·여성·장애인·성소수자·청소년·노인·이주민·천민">
<meta name="twitter:card" content="summary_large_image">

<title>장소 — 다크투어</title>
<link rel="stylesheet" href="assets/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">다크<em>투어</em> <small>지워진 사람들의 자리</small></a>
    <nav class="site-nav">
      <a href="index.html">코스 만들기</a>
      <a href="about.html">이 프로젝트에 대하여</a>
    </nav>
  </div>
</header>

<main id="main" class="wrap">
  <a class="backlink" id="back" href="index.html">← 코스로 돌아가기</a>
  <div id="body"><p class="loading">불러오는 중…</p></div>
</main>

<footer class="site">
  <div class="wrap">
    <p>이 글은 요약본입니다. 사실 확인과 더 깊은 내용은 한국민족문화대백과사전 원문을 확인해 주세요.</p>
  </div>
</footer>

<script src="assets/leaflet/leaflet.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';

  var p = DT.params();
  var areaCode = parseInt(p.area, 10);
  var id = p.id;
  var $ = function (x) { return document.getElementById(x); };

  if (p.back) $('back').href = 'course.html?' + p.back;

  if (!areaCode || !id) {
    $('body').innerHTML = '<div class="empty"><b>장소 정보가 없습니다.</b></div>';
    return;
  }

  Promise.all([DT.findPlace(areaCode, id), DT.loadLenses(), DT.loadTour(),
               DT.loadGrandculture(), DT.loadMotifs()])
    .then(function (r) {
      var place = r[0], lensData = r[1], tourAll = r[2] || {}, gc = r[3], motifData = r[4];
      if (!place) {
        $('body').innerHTML = '<div class="empty"><b>해당 장소를 찾지 못했습니다.</b>코스에서 다시 들어와 주세요.</div>';
        return;
      }
      document.title = place.name + ' — 다크투어';

      var tour = tourAll[place.id] || null;
      var html = '';

      /* 머리 */
      html += '<div class="place-hero">';
      var ev = DT.evidence(place.evidence);
      html += '<div class="badges">' + DT.badges(lensData, place.lenses) +
        (ev ? '<span class="badge badge-ev" data-ev="' + DT.esc(place.evidence) + '" title="' +
          DT.esc(ev.note) + '">' + DT.esc(ev.label) + '</span>' : '') + '</div>';
      html += '<h1 class="page">' + DT.esc(place.name) + '</h1>';
      html += '<p class="lede">' + DT.esc(place.sigungu || '') + ' · ' + DT.esc(place.era || '') + '</p>';
      html += '<div class="voices"><span>이 자리에서 지워진 사람</span>' + DT.esc(place.voices || '') + '</div>';
      html += '</div>';

      /* 지도 */
      if (place.lat != null) html += '<div id="map" class="small"></div>';

      /* 본문 */
      html += '<div class="story">' +
        (place.story || []).map(function (s) { return '<p>' + DT.esc(s) + '</p>'; }).join('') +
        '</div>';

      /* 렌즈별 관점 */
      var noteKeys = Object.keys(place.lensNotes || {});
      if (noteKeys.length) {
        html += '<h2 class="section-title">관점별로 다시 읽기</h2>';
        noteKeys.forEach(function (k) {
          html += '<div class="lensnote" data-lens="' + DT.esc(k) + '">' +
            '<h3>' + DT.esc(DT.lensLabel(lensData, k)) + '의 눈</h3>' +
            '<p>' + DT.esc(place.lensNotes[k]) + '</p></div>';
        });
      }

      /* 같은 이야기가 있는 곳 */
      (place.motifs || []).forEach(function (mid) {
        var m = DT.motifById(motifData, mid);
        if (!m) return;
        var others = (m.places || []).filter(function (x) { return x.id !== place.id; });
        html += '<div class="motif">' +
          '<h3>같은 이야기가 있는 곳 — 「' + DT.esc(m.name) + '」</h3>' +
          '<p class="motif-read">' + DT.esc(m.reading) + '</p>' +
          '<p class="motif-dist">' + DT.esc(m.distribution) + '</p>';
        if (others.length) {
          html += '<ul class="motif-places">' + others.map(function (o) {
            return '<li><a href="' + DT.placeURL(o.areaCode, o.id) + '">' +
              DT.esc(o.name) + '</a> <span>' + DT.esc(o.sigungu) + '</span></li>';
          }).join('') + '</ul>';
        }
        if ((m.candidates || []).length) {
          html += '<p class="motif-todo">아직 정리하지 않은 곳 — ' +
            DT.esc(m.candidates.join(' · ')) + '</p>';
        }
        html += '</div>';
      });

      /* 방문 예절 */
      if (place.ethics) {
        html += '<div class="ethics"><h3>방문하기 전에</h3><p>' + DT.esc(place.ethics) + '</p></div>';
      }

      /* 관광공사 정보 */
      html += '<div class="factbox"><h3>장소 정보 — 한국관광공사 TourAPI</h3>';
      if (tour && tour.matched) {
        if (tour.firstimage) html += '<img src="' + DT.esc(tour.firstimage) + '" alt="' + DT.esc(place.name) + '">';
        html += '<dl>';
        if (tour.addr1) html += '<dt>주소</dt><dd>' + DT.esc(tour.addr1) + '</dd>';
        if (tour.tel) html += '<dt>전화</dt><dd>' + DT.esc(tour.tel) + '</dd>';
        if (place.visit) html += '<dt>관람</dt><dd>' + DT.esc(place.visit) + '</dd>';
        if (place.caution) html += '<dt>유의</dt><dd>' + DT.esc(place.caution) + '</dd>';
        html += '</dl>';
        if (tour.overview) {
          html += '<div style="padding:0 18px 16px"><p style="font-size:.89rem;color:var(--ink-2);margin:0">' +
            DT.esc(tour.overview.replace(/<[^>]*>/g, '')) + '</p></div>';
        }
      } else {
        html += '<dl>';
        html += '<dt>위치</dt><dd>' + DT.esc(place.sigungu || '') +
          (place.coordAccuracy === 'approx' ? ' <span style="color:var(--ink-3)">(좌표는 근사값입니다)</span>' : '') + '</dd>';
        if (place.visit) html += '<dt>관람</dt><dd>' + DT.esc(place.visit) + '</dd>';
        if (place.caution) html += '<dt>유의</dt><dd>' + DT.esc(place.caution) + '</dd>';
        html += '</dl>';
        html += '<p class="unmatched">관광공사 데이터베이스에 등록되지 않은 장소입니다. ' +
          '소수자의 자리는 관광 정보로 관리되지 않는 경우가 많습니다.</p>';
      }
      html += '</div>';

      /* 출처 — 모든 글에 반드시 붙는다 */
      html += '<div class="sources"><h3>' + (ev ? DT.esc(ev.label) : '출처') + '</h3>';
      if (ev) html += '<p class="ev-note">' + DT.esc(ev.note) + '</p>';
      if ((place.sources || []).length) {
        html += '<ul>';
        place.sources.forEach(function (s) {
          var u = DT.sourceURL(s);
          var label = '<span class="src-type">' + DT.esc(s.type) + '</span>' + DT.esc(s.label);
          html += '<li>' + (u
            ? '<a target="_blank" rel="noopener" href="' + DT.esc(u) + '">' + label + '</a>'
            : label) + '</li>';
        });
        html += '</ul>';
      } else {
        html += '<p class="ev-note">출처가 기록되지 않았습니다. 제보해 주세요.</p>';
      }
      if (place.sourceNote) html += '<p class="src-note">' + DT.esc(place.sourceNote) + '</p>';
      html += '</div>';

      /* 링크 */
      html += '<div class="btn-row">';
      if (place.encyQuery) {
        html += '<a class="btn btn-primary" target="_blank" rel="noopener" href="' +
          DT.encyURL(place.encyQuery) + '">한국민족문화대백과사전에서 «' + DT.esc(place.encyQuery) + '» 찾기</a>';
      }
      var gcURL = DT.grandcultureURL(gc, areaCode, place.sigungu);
      if (gcURL) {
        html += '<a class="btn" target="_blank" rel="noopener" href="' + DT.esc(gcURL) + '">디지털' +
          DT.esc(place.sigungu.replace(/(시|군|구)$/, '')) + '문화대전</a>';
      }
      var kakao = DT.kakaoURL(place);
      if (kakao) html += '<a class="btn" target="_blank" rel="noopener" href="' + kakao + '">카카오맵에서 열기</a>';
      (place.links || []).forEach(function (l) {
        html += '<a class="btn" target="_blank" rel="noopener" href="' + DT.esc(l.url) + '">' + DT.esc(l.label) + '</a>';
      });
      html += '</div>';

      $('body').innerHTML = html;

      if (place.lat != null) {
        DT.drawMap(document.getElementById('map'), [place], { numbered: false, line: false });
      }
    });
})();
</script>

</body>
</html>
